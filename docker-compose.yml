name: bloodcell-visionops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloodcell
      POSTGRES_USER: bloodcell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloodcell}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodcell -d bloodcell"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://bloodcell:${POSTGRES_PASSWORD:-bloodcell}@db:5432/bloodcell
      BCV_MODEL_PATH: ${BCV_MODEL_PATH:-models/best.onnx}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://bloodcell:${POSTGRES_PASSWORD:-bloodcell}@db:5432/bloodcell
      BCV_IMAGES_DIR: /app/images
    volumes:
      - ./BCCD_Dataset/BCCD/JPEGImages:/app/images:ro
      - ./reports:/app/reports:ro
      - ./runs/eval:/app/runs/eval:ro
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
