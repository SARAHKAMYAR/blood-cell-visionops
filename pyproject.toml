[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodcell-visionops"
version = "1.0.0"
description = "Blood-smear cell detection (YOLO11) with automated QC, Gemini reports, FastAPI, PostgreSQL and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3"]
dependencies = [
    "ultralytics>=8.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pillow>=10",
    "numpy>=1.26",
    "psycopg2-binary>=2.9",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxslim>=0.1"]
dashboard = ["streamlit>=1.35", "pandas>=2.1", "requests>=2.31", "altair>=5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["bloodcell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: tests that need trained weights (models/best.pt)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
